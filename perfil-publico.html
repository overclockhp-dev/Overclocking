<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil — Overclock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0A0A0C; --card:#101012; --fg:#F5F3EE; --fg-dim:#9C9691; --fg-mute:#5c5954;
    --line:#232326; --gold:#E4293B; --gold-soft:rgba(228,41,59,0.12);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--fg); font-family:'Lora', serif; min-height:100%; }

  header{ background:#000; position:sticky; top:0; z-index:100; }
  header::after{ content:""; display:block; height:2px; background:linear-gradient(90deg, transparent 0%, var(--gold) 50%, transparent 100%); opacity:0.8; }
  .header-inner{ max-width:1200px; margin:0 auto; padding:16px 24px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
  .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--fg); }
  .brand img{ height:32px; width:32px; border-radius:50%; display:block; }
  .brand span{ font-weight:600; font-size:1.15rem; }
  .header-right{ display:flex; align-items:center; gap:20px; }
  .menu{ position:relative; }
  .menu-toggle{ background:none; border:none; font-family:'Lora', serif; font-size:0.95rem; color:var(--fg); display:flex; align-items:center; gap:6px; cursor:pointer; padding:6px 2px; }
  .menu-toggle:hover{ color:var(--gold); }
  .menu-indicator{ font-size:0.8rem; color:var(--fg-dim); }
  .menu-dropdown{ position:absolute; top:calc(100% + 12px); right:0; min-width:180px; background:#0A0A0A; border:1px solid #1E1E1C; padding:6px; display:none; flex-direction:column; z-index:50; }
  .menu.open .menu-dropdown{ display:flex; }
  .menu-dropdown a{ color:var(--fg); text-decoration:none; font-size:0.92rem; padding:9px 11px; }
  .menu-dropdown a:hover{ background:#161614; color:var(--gold); }
  .menu-dropdown a.menu-item-profile{ display:none; border-top:1px solid var(--line); margin-top:6px; padding-top:12px; color:var(--gold); font-weight:600; }
  .menu-dropdown a.menu-item-profile.visible{ display:block; }
  .menu-dropdown a.menu-item-logout{ display:none; color:var(--fg-dim); font-size:0.88rem; }
  .menu-dropdown a.menu-item-logout.visible{ display:block; }
  .menu-dropdown a.menu-item-login.hidden{ display:none; }
  body.menu-open{ overflow:hidden; height:100%; }
  .login-link{ color:var(--fg); text-decoration:none; font-size:0.9rem; font-weight:500; background:var(--gold); padding:8px 16px; }
  .login-link:hover{ background:#FF3B4E; }

  .page{ padding:32px 16px 80px; display:flex; flex-direction:column; align-items:center; gap:20px; }

  .profile-card{
    width:100%; max-width:440px; background:var(--card); border-radius:20px; overflow:hidden;
    border:1px solid var(--line); box-shadow:0 20px 60px rgba(0,0,0,0.55); padding:28px 24px; text-align:center;
  }
  .pp-avatar{
    width:96px; height:96px; border-radius:50%; object-fit:cover; margin:0 auto 14px;
    display:block; border:3px solid #1a1a1e; outline:2px solid var(--gold); background:#1a1a1e;
  }
  .pp-name{ margin:0; font-size:1.3rem; font-weight:700; }
  .pp-username{ color:var(--fg-mute); font-size:0.9rem; margin-top:2px; }
  .pp-stars{ display:flex; gap:3px; justify-content:center; margin-top:10px; }
  .pp-bio{ margin-top:18px; font-size:0.9rem; line-height:1.6; color:var(--fg-dim); white-space:pre-wrap; }
  .pp-bio.empty{ color:var(--fg-mute); font-style:italic; }
  .pp-back{ display:inline-block; margin-top:20px; color:var(--gold); text-decoration:underline; font-size:0.85rem; }

  .fav-wrap{ width:100%; max-width:440px; }
  .fav-block{ margin-bottom:18px; }
  .fav-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .fav-header h3{ margin:0; font-size:0.9rem; font-weight:600; }
  .fav-header span{ font-size:0.75rem; color:var(--fg-mute); }
  .fav-scroll{ display:flex; gap:10px; overflow-x:auto; padding-bottom:8px; }
  .fav-card{ flex:0 0 auto; width:100px; border:1px solid var(--line); background:var(--card); border-radius:10px; overflow:hidden; }
  .fav-card-thumb{ aspect-ratio:3/4; background:#0f0f11; }
  .fav-card-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .fav-card-title{ font-size:0.72rem; font-weight:600; padding:7px 7px 3px; margin:0; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .fav-card-status{ font-size:0.65rem; color:var(--fg-mute); padding:0 7px 8px; }
  .fav-empty{ border:1px dashed var(--line); border-radius:10px; color:var(--fg-mute); font-size:0.82rem; padding:14px; line-height:1.5; }

  .loading, .error-state{ color:var(--fg-dim); text-align:center; padding:60px 20px; font-size:0.9rem; }

  /* ============ MODAL: INICIAR SESIÓN / CREAR CUENTA ============ */
  .auth-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.75); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; padding:24px; z-index:200; }
  .auth-overlay.open{ display:flex; }
  .auth-card{
    position:relative; width:100%; max-width:380px;
    background:radial-gradient(circle at 50% 0%, rgba(228,41,59,0.22), transparent 55%), #0A0A0A;
    border:1px solid var(--line); padding:40px 32px 34px; box-shadow:0 30px 80px rgba(0,0,0,0.7);
  }
  .auth-close{ position:absolute; top:16px; right:16px; background:none; border:none; color:var(--fg-dim); font-size:1.3rem; line-height:1; cursor:pointer; padding:4px; }
  .auth-close:hover{ color:var(--gold); }
  .auth-brand{ display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:26px; }
  .auth-brand img{ width:44px; height:44px; border-radius:50%; }
  .auth-brand span{ font-family:'Lora', serif; font-size:0.78rem; font-weight:600; letter-spacing:0.22em; color:var(--fg-dim); }
  .auth-heading{ text-align:center; font-family:'Lora', serif; font-size:1.5rem; font-weight:700; margin-bottom:6px; }
  .auth-subheading{ text-align:center; font-size:0.9rem; color:var(--fg-dim); margin-bottom:26px; }
  .auth-tabs{ display:flex; border:1px solid var(--line); margin-bottom:24px; }
  .auth-tab{ flex:1; background:none; border:none; color:var(--fg-dim); font-family:'Lora', serif; font-size:0.92rem; font-weight:500; padding:11px 0; cursor:pointer; }
  .auth-tab.active{ background:var(--gold); color:var(--fg); }
  .auth-form{ display:none; flex-direction:column; gap:16px; }
  .auth-form.active{ display:flex; }
  .auth-oauth{ display:flex; align-items:center; justify-content:center; gap:10px; width:100%; background:#fff; color:#0d0d0d; border:none; font-family:'Lora', serif; font-size:0.95rem; font-weight:500; padding:12px 0; cursor:pointer; }
  .auth-oauth svg{ width:19px; height:19px; }
  .auth-divider{ display:flex; align-items:center; gap:14px; color:var(--fg-dim); font-size:0.75rem; letter-spacing:0.06em; text-transform:uppercase; margin:22px 0 18px; }
  .auth-divider::before, .auth-divider::after{ content:""; flex:1; height:1px; background:var(--line); }
  .auth-error{ display:none; background:rgba(228,41,59,0.1); border:1px solid rgba(228,41,59,0.4); color:#ff8a95; font-size:0.85rem; line-height:1.5; padding:10px 14px; margin:-4px 0 18px; }
  .auth-error.visible{ display:block; }
  .auth-error.success{ background:rgba(76,175,80,0.1); border-color:rgba(76,175,80,0.4); color:#8fd694; }
  .auth-field label{ display:block; font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--fg-dim); margin-bottom:8px; }
  .auth-field input{ width:100%; background:#050505; border:1px solid var(--line); color:var(--fg); font-family:'Lora', serif; font-size:0.95rem; padding:12px 14px; }
  .auth-field input:focus{ outline:none; border-color:var(--gold); }
  .auth-submit{ background:var(--gold); color:var(--fg); border:none; font-family:'Lora', serif; font-size:0.98rem; font-weight:500; padding:13px 0; cursor:pointer; margin-top:4px; }
  .auth-switch{ text-align:center; font-size:0.85rem; color:var(--fg-dim); margin-top:20px; }
  .auth-switch button{ background:none; border:none; color:var(--gold); font-family:'Lora', serif; font-size:0.85rem; cursor:pointer; text-decoration:underline; padding:0; }
</style>
</head>
<body>

<div id="menu-container"></div>
<div id="auth-container"></div>

<div class="page" id="page">
  <p class="loading">Cargando perfil…</p>
</div>

<script src="auth.js"></script>
<script src="components.js"></script>
<script src="avatars-data.js"></script>
<script>
function starSvg(filled, size) {
  size = size || 15;
  const color = filled ? 'var(--gold)' : '#2a2a2e';
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
}
function reputationStarsHtml(points) {
  const filled = Math.min(5, Math.floor((points || 0) / 5));
  let html = '<div class="pp-stars">';
  for (let i = 0; i < 5; i++) html += starSvg(i < filled, 16);
  html += '</div>';
  return html;
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

function getSupabaseClient() {
  if (window.ocAuth && window.ocAuth.supabase && window.ocAuth.supabase.from) return window.ocAuth.supabase;
  if (window.supabase && window.supabase.from) return window.supabase;
  return null;
}

// No sabemos con exactitud cuándo auth.js termina de preparar el cliente,
// así que reintentamos por hasta 3 segundos en vez de rendirnos al primer intento.
function waitForSupabaseClient(maxAttempts = 30, intervalMs = 100) {
  return new Promise((resolve) => {
    let attempts = 0;
    (function tryGet() {
      const sb = getSupabaseClient();
      if (sb) return resolve(sb);
      attempts++;
      if (attempts >= maxAttempts) return resolve(null);
      setTimeout(tryGet, intervalMs);
    })();
  });
}

async function loadPublicProfile() {
  const params = new URLSearchParams(window.location.search);
  const userId = params.get('u');
  const page = document.getElementById('page');

  if (!userId) {
    page.innerHTML = '<p class="error-state">No se indicó qué perfil mostrar.<br><a class="pp-back" href="foro.html">Volver al foro</a></p>';
    return;
  }

  const sb = await waitForSupabaseClient();
  if (!sb) {
    page.innerHTML = '<p class="error-state">No se pudo conectar con el servidor.</p>';
    return;
  }

  const { data: profile, error } = await sb.from('profiles').select('*').eq('id', userId).maybeSingle();

  if (error || !profile) {
    page.innerHTML = '<p class="error-state">No se encontró este perfil.<br><a class="pp-back" href="foro.html">Volver al foro</a></p>';
    return;
  }

  const avatar = window.ocGetAvatar ? window.ocGetAvatar(profile.avatar_id || 'neko1') : null;
  const avatarSrc = avatar ? avatar.image : '';
  const fallback = window.ocPlaceholderAvatar ? window.ocPlaceholderAvatar(profile.display_name) : '';

  const { data: favRows } = await sb.from('favorites').select('*').eq('user_id', userId);
  const favHtml = renderFavoritesHtml(favRows || []);

  page.innerHTML = `
    <div class="profile-card">
      <img class="pp-avatar" src="${escapeHtml(avatarSrc)}" alt="" onerror="this.onerror=null;this.src='${fallback}'">
      <h2 class="pp-name">${escapeHtml(profile.display_name || 'Usuario')}</h2>
      <div class="pp-username">@${escapeHtml(profile.username || 'usuario')}</div>
      ${reputationStarsHtml(profile.social_reputation_points)}
      <p class="pp-bio ${profile.bio ? '' : 'empty'}">${profile.bio ? escapeHtml(profile.bio) : 'Sin descripción'}</p>
    </div>

    <div class="fav-wrap">
      ${favHtml}
    </div>

    <a class="pp-back" href="foro.html">← Volver al foro</a>
  `;
}

const FORMAT_FAV = [
  { key: 'manhwa', label: 'Manhwa' },
  { key: 'manga', label: 'Manga' },
  { key: 'anime', label: 'Anime' },
  { key: 'novela', label: 'Novela' },
];
const STATUS_LABELS = { quiero: 'Quiero leer', leyendo: 'Leyendo', terminado: 'Terminado', abandonado: 'Abandonado' };

function placeholderCover(title) {
  const initial = (title || '?').trim().charAt(0).toUpperCase() || '?';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="280"><rect width="100%" height="100%" fill="#0f0f11"/><text x="50%" y="50%" font-family="Georgia,serif" font-size="64" fill="#E4293B" text-anchor="middle" dominant-baseline="central">${initial}</text></svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

function renderFavoritesHtml(rows) {
  return FORMAT_FAV.map(({ key, label }) => {
    const items = rows.filter(r => r.format === key);
    const body = items.length
      ? `<div class="fav-scroll">${items.map(it => `
          <div class="fav-card" title="${escapeHtml(it.title)}">
            <div class="fav-card-thumb">
              <img src="assets/covers/${escapeHtml(it.work_id)}.jpg" alt="" loading="lazy"
                onerror="this.onerror=null;this.src='${placeholderCover(it.title)}'">
            </div>
            <h4 class="fav-card-title">${escapeHtml(it.title)}</h4>
            <div class="fav-card-status">${escapeHtml(STATUS_LABELS[it.status] || it.status || '')}</div>
          </div>`).join('')}</div>`
      : `<div class="fav-empty">Sin ${label.toLowerCase()} todavía.</div>`;
    return `
      <section class="fav-block">
        <div class="fav-header"><h3>${label}</h3><span>${items.length}</span></div>
        ${body}
      </section>`;
  }).join('');
}

document.addEventListener('DOMContentLoaded', () => {
  loadPublicProfile();
});
</script>
</body>
</html>
