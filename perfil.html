<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil — Overclock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0A0A0C;
    --card:#101012;
    --card-2:#151517;
    --fg:#F5F3EE;
    --fg-dim:#9C9691;
    --fg-mute:#5c5954;
    --line:#232326;
    --line-2:#2a2a2e;
    --gold:var(--accent);
    --gold-soft:rgba(228,41,59,0.12);
    --accent:#E4293B;
    --danger:#C9705A;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--fg);
    font-family:'Lora', serif;
    min-height:100%;
  }

  header{
    background:#000;
    position:sticky;
    top:0;
    z-index:100;
  }
  header::after{
    content:"";
    display:block;
    height:2px;
    background:linear-gradient(90deg, transparent 0%, var(--accent) 50%, transparent 100%);
    opacity:0.8;
  }
  .header-inner{
    max-width:1200px;
    margin:0 auto;
    padding:16px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:var(--fg);
  }
  .brand img{
    height:32px;
    width:32px;
    border-radius:50%;
    display:block;
  }
  .brand span{ font-weight:600; font-size:1.15rem; }
  .header-right{ display:flex; align-items:center; gap:20px; }
  .menu{ position:relative; }
  .menu-toggle{
    background:none;
    border:none;
    font-family:'Lora', serif;
    font-size:0.95rem;
    color:var(--fg);
    display:flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
    padding:6px 2px;
  }
  .menu-toggle:hover{ color:var(--accent); }
  .menu-indicator{ font-size:0.8rem; color:var(--fg-dim); }
  .menu-dropdown{
    position:absolute;
    top:calc(100% + 12px);
    right:0;
    min-width:180px;
    background:#0A0A0A;
    border:1px solid #1E1E1C;
    padding:6px;
    display:none;
    flex-direction:column;
    z-index:50;
  }
  .menu.open .menu-dropdown{ display:flex; }
  .menu-dropdown a{
    color:var(--fg);
    text-decoration:none;
    font-size:0.92rem;
    padding:9px 11px;
  }
  .menu-dropdown a:hover{ background:#161614; color:var(--accent); }

  .menu-dropdown a.menu-item-profile{
    display:none;
    border-top:1px solid var(--line);
    margin-top:6px;
    padding-top:12px;
    color:var(--accent);
    font-weight:600;
  }
  .menu-dropdown a.menu-item-profile.visible{ display:block; }

  .menu-dropdown a.menu-item-logout{
    display:none;
    color:var(--fg-dim);
    font-size:0.88rem;
  }
  .menu-dropdown a.menu-item-logout.visible{ display:block; }

  .menu-dropdown a.menu-item-login.hidden{ display:none; }

  body.menu-open{ overflow:hidden; height:100%; }

  .login-link{
    color:var(--fg);
    text-decoration:none;
    font-size:0.9rem;
    font-weight:500;
    background:var(--accent);
    padding:8px 16px;
  }
  .login-link:hover{ background:#FF3B4E; }

  .page{
    padding:28px 16px 80px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
  }

  .profile-card{
    width:100%;
    max-width:440px;
    background:var(--card);
    border-radius:20px;
    overflow:hidden;
    border:1px solid var(--line);
    box-shadow:0 20px 60px rgba(0,0,0,0.55);
  }

  .profile-banner{
    position:relative;
    height:132px;
    transition:background .6s ease;
    overflow:hidden;
  }
  .profile-banner img.banner-photo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
  }
  .profile-banner.has-photo img.banner-photo{ display:block; }
  .profile-banner.has-photo .banner-svg{ opacity:0.25; }

  .banner-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity:0.5;
    pointer-events:none;
  }

  .exclusive-title{
    position:absolute;
    top:14px;
    left:20px;
    right:20px;
    z-index:2;
    font-style:italic;
    font-weight:500;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold);
  }

  .profile-content{ position:relative; padding:0 20px; }

  .identity-row{
    display:flex;
    align-items:flex-end;
    margin-top:-44px;
  }

  .avatar-btn{
    position:relative;
    width:88px;
    height:88px;
    border-radius:50%;
    border:3px solid var(--card);
    outline:2px solid var(--gold);
    cursor:pointer;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    overflow:hidden;
    background:#1a1a1e;
  }
  .avatar-btn img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
  }
  .avatar-btn.has-photo img{ display:block; }
  .avatar-btn .avatar-fallback{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:100%;
    color:var(--gold);
    opacity:0.85;
  }
  .avatar-btn.has-photo .avatar-fallback{ display:none; }

  .avatar-btn.playing{ animation:pulseRing 1.1s ease-out; }

  @keyframes pulseRing{
    0%{ box-shadow:0 0 0 0 rgba(228,41,59,0.55); }
    70%{ box-shadow:0 0 0 16px rgba(228,41,59,0); }
    100%{ box-shadow:0 0 0 0 rgba(228,41,59,0); }
  }

  .avatar-hint{
    position:absolute;
    bottom:-26px;
    left:50%;
    transform:translateX(-50%);
    font-size:10px;
    color:var(--fg-dim);
    white-space:nowrap;
    opacity:0;
    transition:opacity .2s ease;
    pointer-events:none;
  }
  .avatar-btn:hover .avatar-hint{ opacity:1; }

  .camera-btn{
    position:absolute;
    bottom:-2px;
    right:-2px;
    width:24px;
    height:24px;
    border-radius:50%;
    background:#1b1b1e;
    border:2px solid var(--card);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:3;
    padding:0;
    color:var(--fg-dim);
  }
  .camera-btn:hover{ color:var(--gold); }

  .identity-text{
    margin-left:14px;
    padding-bottom:6px;
    flex:1;
    min-width:0;
  }

  .name-row{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }

  .name-display{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
  }
  .name-display h2{
    margin:0;
    font-weight:700;
    font-size:20px;
    color:var(--fg);
  }
  .username-tag{
    font-size:12px;
    color:var(--fg-mute);
  }
  .username-edit-row{ display:flex; align-items:center; gap:5px; }
  .username-edit-row input{
    font-family:'Lora', serif; font-size:12px; color:var(--fg);
    background:#0f0f11; border:1px solid var(--line-2); border-radius:6px;
    padding:2px 6px; outline:none; width:110px;
  }
  .username-edit-row input:focus{ border-color:var(--gold); }

  .icon-btn{
    background:none;
    border:none;
    padding:4px;
    cursor:pointer;
    display:flex;
    color:var(--fg-mute);
    flex-shrink:0;
  }
  .icon-btn:hover{ color:var(--fg-dim); }

  .name-edit{ display:flex; flex-direction:column; gap:3px; }
  .name-edit-row{ display:flex; align-items:center; gap:6px; }
  .name-edit input{
    font-family:'Lora', serif;
    font-weight:700;
    font-size:20px;
    color:var(--fg);
    background:#0f0f11;
    border:1px solid var(--line-2);
    border-radius:7px;
    padding:2px 8px;
    outline:none;
    width:150px;
  }
  .name-edit input:focus{ border-color:var(--gold); }

  .btn-mini{
    border-radius:6px;
    width:22px;
    height:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    padding:0;
    font-size:12px;
    line-height:1;
  }
  .btn-mini.ok{ background:var(--gold); border:none; color:#101012; }
  .btn-mini.cancel{ background:none; border:1px solid var(--line-2); color:var(--fg-dim); }

  .char-hint{ font-size:10px; color:var(--fg-mute); padding-left:2px; }
  .char-hint.over{ color:var(--danger); }

  .field-error{
    font-size:11px;
    color:var(--danger);
    padding-left:2px;
    display:none;
  }
  .field-error.visible{ display:block; }

  .social-inline{ display:flex; gap:6px; align-items:center; }
  .social-inline a{ color:var(--fg-dim); display:flex; text-decoration:none; }
  .social-inline a:hover{ color:var(--gold); }

  .stars-row{ display:flex; gap:2px; align-items:center; margin-top:4px; }
  .stars-row svg{ display:block; }
  .stars-row .star-filled{ color:var(--gold); }
  .stars-row .star-empty{ color:var(--line-2); }
  .sync-note{ font-size:10px; color:var(--fg-mute); margin-top:6px; }

  .gallery{ margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; }
  .gallery button{
    width:40px;
    height:40px;
    border-radius:50%;
    border:2px solid var(--line);
    cursor:pointer;
    padding:0;
    overflow:hidden;
    background:#1a1a1e;
  }
  .gallery button.active{ border-color:var(--gold); }
  .gallery button img{ width:100%; height:100%; object-fit:cover; display:none; }
  .gallery button.has-photo img{ display:block; }

  .social-panel{
    margin-top:14px;
    padding:14px;
    background:var(--card-2);
    border:1px solid var(--line);
    border-radius:12px;
  }
  .social-panel-label{
    font-size:11px;
    color:var(--fg-dim);
    margin-bottom:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
  }
  .social-list{ display:flex; flex-direction:column; gap:8px; }
  .social-row{ display:flex; align-items:center; gap:8px; }
  .social-toggle{
    width:26px;
    height:26px;
    border-radius:7px;
    border:1px solid var(--line-2);
    background:transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    color:var(--fg-mute);
    padding:0;
  }
  .social-toggle.on{
    border-color:var(--gold);
    background:var(--gold-soft);
    color:var(--gold);
  }
  .social-row .net-label{
    font-size:13px;
    color:#cfcac4;
    width:88px;
    flex-shrink:0;
  }
  .social-row input{
    flex:1;
    min-width:0;
    background:#0f0f11;
    border:1px solid var(--line);
    border-radius:6px;
    padding:5px 8px;
    font-size:12px;
    color:#e8e4de;
    outline:none;
    font-family:'Lora', serif;
  }
  .social-row input:focus{ border-color:var(--gold); }
  .social-row input:disabled{ opacity:0.4; }

  .desc-block{ margin-top:16px; padding-bottom:22px; }
  .desc-view{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .desc-view p{
    margin:0;
    font-size:13.5px;
    line-height:1.6;
    color:var(--fg-dim);
    white-space:pre-wrap;
    word-break:break-word;
  }
  .desc-view p.empty{ color:var(--fg-mute); font-style:italic; }
  .desc-edit textarea{
    width:100%;
    resize:none;
    background:#0f0f11;
    border:1px solid var(--line-2);
    border-radius:10px;
    padding:10px;
    color:#e8e4de;
    font-family:'Lora', serif;
    font-size:13.5px;
    outline:none;
  }
  .desc-edit textarea:focus{ border-color:var(--gold); }
  .desc-edit-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:6px;
  }
  .desc-actions{ display:flex; gap:8px; }
  .btn-text{
    background:none;
    border:1px solid var(--line-2);
    color:var(--fg-dim);
    border-radius:7px;
    padding:5px 10px;
    font-size:12px;
    cursor:pointer;
    font-family:'Lora', serif;
  }
  .btn-gold{
    background:var(--gold);
    border:none;
    color:#101012;
    border-radius:7px;
    padding:5px 10px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    font-family:'Lora', serif;
  }

  .fav-wrap{ width:100%; max-width:440px; }
  .fav-block{ margin-bottom:22px; }
  .fav-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .fav-header h3{
    margin:0;
    font-size:0.95rem;
    font-weight:600;
    color:var(--fg);
  }
  .fav-header span{ font-size:0.75rem; color:var(--fg-mute); }
  .fav-scroll{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding-bottom:8px;
    scrollbar-width:thin;
    scrollbar-color:var(--line) transparent;
  }
  .fav-card{
    flex:0 0 auto;
    width:100px;
    border:1px solid var(--line);
    background:var(--card);
    border-radius:10px;
    overflow:hidden;
    text-decoration:none;
    color:var(--fg);
    transition:border-color .2s;
  }
  .fav-card:hover{ border-color:var(--gold); }
  .fav-card-thumb{ aspect-ratio:3/4; background:#0f0f11; }
  .fav-card-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .fav-card-title{
    font-size:0.72rem;
    font-weight:600;
    padding:7px 7px 3px;
    margin:0;
    line-height:1.3;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .fav-card-status{
    font-size:0.65rem;
    color:var(--fg-mute);
    padding:0 7px 8px;
  }
  .fav-empty{
    border:1px dashed var(--line);
    border-radius:10px;
    color:var(--fg-mute);
    font-size:0.82rem;
    padding:14px;
    line-height:1.5;
  }
  .fav-empty a{ color:var(--gold); }

  @media (max-width:480px){
    .header-inner{ padding:14px 16px; }
    .brand span{ font-size:1.05rem; }
  }
</style>
</head>

<div id="menu-container"></div>

<div class="page">
  <div class="profile-card" id="profileCard"></div>
  <div class="fav-wrap" id="favWrap"></div>

<script src="auth.js"></script>

<script>
/*
  Imágenes / audio (colócalos tú en assets):
    assets/profile/avatars/{id}.jpg
    assets/profile/banners/{id}.jpg
    assets/profile/audio/{id}.mp3

  Si no hay archivo, se usa degradado + tono Web Audio de demo.
  Título exclusivo: no editable; cambia al cambiar de foto.

  NOTA (sincronización con Supabase):
  El catálogo AVATARS ahora vive en avatars-data.js (compartido con foro.html
  y perfil-publico.html). Este script ya no lo declara, solo lo usa.
  Además de guardar en localStorage (igual que siempre, para que el perfil
  siga siendo instantáneo), cada cambio se sincroniza a la tabla "profiles"
  de Supabase para que el foro y los perfiles públicos puedan mostrarlo.
  El @usuario se genera automáticamente la primera vez (desde el correo) y
  por ahora NO es editable desde aquí — si quieres que se pueda editar, lo
  agregamos después.
*/

const GOLD = '#E4293B';
const DESC_LIMIT = 160;
const NAME_LIMIT = 32;
const STORAGE_KEY = 'oc_profile_v1';

// Lista base de palabras prohibidas para nombre y descripción.
// Amplíala según lo que necesites moderar.
const BANNED_WORDS = [
  'puta', 'puto', 'putos', 'putas', 'mierda', 'pendejo', 'pendeja',
  'idiota', 'estupido', 'estúpido', 'estupida', 'estúpida', 'maldito',
  'maldita', 'cabron', 'cabrón', 'imbecil', 'imbécil', 'zorra', 'perra',
  'verga', 'joder', 'gilipollas'
];

function containsBannedWord(text) {
  const normalized = (text || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, ''); // quita acentos para detectar variantes
  return BANNED_WORDS.some(w => normalized.includes(
    w.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  ));
}

];

function iconSvg(path, size) {
  size = size || 15;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="${path}"/></svg>`;
}

function starSvg(filled, size) {
  size = size || 14;
  const cls = filled ? 'star-filled' : 'star-empty';
  return `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
}

function reputationStarsHtml(points, size) {
  const filled = Math.min(5, Math.floor((points || 0) / 5));
  let html = '<div class="stars-row">';
  for (let i = 0; i < 5; i++) html += starSvg(i < filled, size);
  html += '</div>';
  return html;
}

function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function defaultProfile() {
  return {
    name: 'Usuario',
    description: '',
    avatarId: AVATARS[0].id,
    username: null,               // se llena al sincronizar con Supabase
    reputationPoints: 0,          // se llena al sincronizar con Supabase
    socials: SOCIALS.reduce((acc, s) => {
      acc[s.id] = { enabled: s.id === 'instagram' || s.id === 'discord', url: '' };

function loadProfile() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultProfile();
    const data = JSON.parse(raw);
    const base = defaultProfile();
    return { ...base, ...data, socials: { ...base.socials, ...(data.socials || {}) } };
  } catch {
    return defaultProfile();
  }
}

function saveProfile(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

let syncNoteTimer = null;
function setSyncNote(text) {
  const el = document.getElementById('syncNote');
  if (!el) return;
  el.textContent = text;
  clearTimeout(syncNoteTimer);
  if (text) syncNoteTimer = setTimeout(() => { el.textContent = ''; }, 2500);
}

async function syncProfileToSupabase(data) {
  const sb = window.ocAuth && window.ocAuth.supabase;
  const user = window.ocAuth && window.ocAuth.currentUser;
  if (!sb || !user) return; // sin sesión o sin cliente disponible: solo queda local

  const { error } = await sb.from('profiles').upsert({
    id: user.id,
    display_name: data.name,
    bio: data.description || '',
    avatar_id: data.avatarId,
    socials: data.socials
  });

  setSyncNote(error ? 'No se pudo sincronizar con el servidor.' : 'Sincronizado ✓');
}

async function fetchRemoteProfile() {
  const sb = window.ocAuth && window.ocAuth.supabase;
  const user = window.ocAuth && window.ocAuth.currentUser;
  if (!sb || !user) return;

  const { data, error } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if (!error && data) {
    profile.username = data.username;
    profile.reputationPoints = data.social_reputation_points || 0;
    render();
  }

  syncFavoritesToSupabase();
}

function getFavoritesFlat() {
  const library = loadLibrary();
  const works = loadWorksIndex();
  const byId = Object.fromEntries(works.map(w => [w.id, w]));
  return Object.keys(library).map(id => {
    const meta = byId[id];
    return {
      id,
      title: meta ? meta.title : id,
      format: meta ? meta.format : guessFormat(id),
      status: library[id],
    };
  }).filter(f => f.format);
}

async function syncFavoritesToSupabase() {
  const sb = window.ocAuth && window.ocAuth.supabase;
  const user = window.ocAuth && window.ocAuth.currentUser;
  if (!sb || !user) return;

  const flat = getFavoritesFlat();

  // Reemplaza el set completo: borra lo que había y sube el estado actual.
  await sb.from('favorites').delete().eq('user_id', user.id);
  if (flat.length) {
    await sb.from('favorites').insert(flat.map(f => ({
      user_id: user.id,
      work_id: f.id,
      title: f.title,
      format: f.format,
      status: f.status,
    })));
  }
}

let audioCtx = null;
const fileAudio = new Audio();
fileAudio.preload = 'none';

function playTone(freq) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.18, now + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 1.2);
    return 1100;
  } catch {
    return 0;
  }
}

function playPhotoAudio(avatar, onStart, onEnd) {
  fileAudio.pause();
  fileAudio.currentTime = 0;

  const tryFile = () => new Promise((resolve) => {
    let settled = false;
    const done = (ok) => { if (!settled) { settled = true; resolve(ok); } };
    fileAudio.oncanplaythrough = () => done(true);
    fileAudio.onerror = () => done(false);
    fileAudio.src = avatar.audio;
    fileAudio.load();
    setTimeout(() => done(false), 600);
  });

  tryFile().then((ok) => {
    if (ok) {
      onStart();
      fileAudio.play().then(() => { fileAudio.onended = onEnd; })
        .catch(() => {
          const ms = playTone(avatar.freq);
          onStart();
          setTimeout(onEnd, ms || 1100);
        });
    } else {
      const ms = playTone(avatar.freq);
      onStart();
      setTimeout(onEnd, ms || 1100);
    }
  });
}

function loadWorksIndex() {
  try {
    const raw = localStorage.getItem('oc_works_index');
    if (raw) {
      const p = JSON.parse(raw);
      if (Array.isArray(p) && p.length) return p;
    }
  } catch (_) {}
  return WORKS_INDEX.slice();
}

function loadLibrary() {
  try { return JSON.parse(localStorage.getItem('oc_library') || '{}'); }
  catch { return {}; }
}

function guessFormat(id) {
  const s = String(id);
  if (s.startsWith('mh')) return 'manhwa';
  if (s.startsWith('mg')) return 'manga';
  if (s.startsWith('an')) return 'anime';
  if (s.startsWith('nv')) return 'novela';
  return '';
}

function getFavoritesByFormat() {
  const library = loadLibrary();
  const works = loadWorksIndex();
  const byId = Object.fromEntries(works.map(w => [w.id, w]));
  const groups = { manhwa: [], manga: [], anime: [], novela: [] };

  Object.keys(library).forEach(id => {
    const meta = byId[id];
    const format = meta ? meta.format : guessFormat(id);
    if (!groups[format]) return;
    groups[format].push({
      id,
      title: meta ? meta.title : id,
      status: library[id],
      cover: 'assets/covers/' + id + '.jpg'
    });
  });
  return groups;
}

function placeholderCover(title) {
  const initial = (title || '?').trim().charAt(0).toUpperCase() || '?';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="280"><rect width="100%" height="100%" fill="#0f0f11"/><text x="50%" y="50%" font-family="Georgia,serif" font-size="64" fill="#C9A15A" text-anchor="middle" dominant-baseline="central">${initial}</text></svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

function renderFavorites() {
  const groups = getFavoritesByFormat();
  const wrap = document.getElementById('favWrap');
  wrap.innerHTML = FORMAT_FAV.map(({ key, label }) => {
    const items = groups[key] || [];
    const body = items.length
      ? `<div class="fav-scroll">${items.map(it => `
          <a class="fav-card" href="biblioteca.html" title="${escapeHtml(it.title)}">
            <div class="fav-card-thumb">
              <img src="${escapeHtml(it.cover)}" alt="" loading="lazy"
                onerror="this.onerror=null;this.src='${placeholderCover(it.title)}'">
            </div>
            <h4 class="fav-card-title">${escapeHtml(it.title)}</h4>
            <div class="fav-card-status">${escapeHtml(STATUS_LABELS[it.status] || it.status || '')}</div>
          </a>`).join('')}</div>`
      : `<div class="fav-empty">Aún no tienes ${label.toLowerCase()}. Guarda obras en la <a href="biblioteca.html">Biblioteca</a>.</div>`;

    return `
      <section class="fav-block">
        <div class="fav-header">
          <h3>${label}</h3>
          <span>${items.length}</span>
        </div>
        ${body}
      </section>`;
  }).join('');
}

function wireImageFallback(imgId, parentId) {
  const img = document.getElementById(imgId);
  const parent = document.getElementById(parentId);
  if (!img || !parent) return;
  img.onload = () => parent.classList.add('has-photo');
  img.onerror = () => {
    parent.classList.remove('has-photo');
    img.style.display = 'none';
  };
  if (img.complete && img.naturalWidth > 0) parent.classList.add('has-photo');
}

function bindCardEvents() {
  const avatar = getAvatar(activeId);

  document.getElementById('avatarBtn').onclick = () => {
    playPhotoAudio(avatar, () => {
      playing = true;
      document.getElementById('avatarBtn')?.classList.add('playing');
    }, () => {
      playing = false;
      document.getElementById('avatarBtn')?.classList.remove('playing');
    });
  };

  document.getElementById('cameraBtn').onclick = (e) => {
    e.stopPropagation();
    showGallery = !showGallery;
    render();
  };

  document.getElementById('socialToggle').onclick = () => {
    showSocialPanel = !showSocialPanel;
    persistSocialInputs();
    render();
  };

  if (showGallery) {
    document.querySelectorAll('#gallery button').forEach(btn => {
      btn.onclick = () => setActiveAvatar(btn.dataset.id);
    });
  }

  if (showSocialPanel) {
    document.querySelectorAll('.social-toggle').forEach(btn => {
      btn.onclick = () => {
        persistSocialInputs();
        const id = btn.dataset.net;
        profile.socials[id].enabled = !profile.socials[id].enabled;
        saveProfile(profile);
        render();
      };
    });
    document.querySelectorAll('[data-net-url]').forEach(input => {
      input.addEventListener('change', () => {
        const id = input.getAttribute('data-net-url');
        let url = input.value.trim();
        if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
        profile.socials[id].url = url;
        saveProfile(profile);
      });
    });
  }

  if (editingUsername) {
    const input = document.getElementById('usernameInput');
    input.focus();
    input.onkeydown = (e) => {
      if (e.key === 'Enter') saveUsername();
      if (e.key === 'Escape') cancelUsername();
    };
    document.getElementById('usernameSave').onclick = saveUsername;
    document.getElementById('usernameCancel').onclick = cancelUsername;
  } else {
    document.getElementById('usernameEditBtn').onclick = () => {
      draftUsername = profile.username || '';
      editingUsername = true;
      render();
    };
  }

  if (editingName) {
    const input = document.getElementById('nameInput');
    input.focus();
    input.oninput = () => {
      draftName = input.value;
      const c = document.getElementById('nameCount');
      if (c) {
        c.textContent = `${draftName.length}/${NAME_LIMIT}`;
        c.classList.toggle('over', draftName.length >= NAME_LIMIT);
      }
      const err = document.getElementById('nameError');
      if (err) err.classList.remove('visible');
    };
    input.onkeydown = (e) => {
      if (e.key === 'Enter') saveName();
      if (e.key === 'Escape') cancelName();
    };
    document.getElementById('nameSave').onclick = saveName;
    document.getElementById('nameCancel').onclick = cancelName;
  } else {
    document.getElementById('nameEditBtn').onclick = () => {
      draftName = profile.name;
      editingName = true;
      render();
    };
  }

  if (editingDesc) {
    const ta = document.getElementById('descInput');
    ta.focus();
    ta.oninput = () => {
      draftDesc = ta.value.slice(0, DESC_LIMIT);
      const c = document.getElementById('descCount');
      if (c) {
        c.textContent = `${draftDesc.length}/${DESC_LIMIT}`;
        c.classList.toggle('over', draftDesc.length >= DESC_LIMIT);
      }
      const err = document.getElementById('descError');
      if (err) err.classList.remove('visible');
    };
    document.getElementById('descSave').onclick = () => {
      const clean = draftDesc.slice(0, DESC_LIMIT);
      if (containsBannedWord(clean)) {
        const err = document.getElementById('descError');
        if (err) {
          err.textContent = 'Tu descripción contiene palabras no permitidas.';
          err.classList.add('visible');
        }
        return;
      }
      profile.description = clean;
      editingDesc = false;
      saveProfile(profile);
      render();
    };
    document.getElementById('descCancel').onclick = () => {
      draftDesc = profile.description || '';
      editingDesc = false;
      render();
    };
  } else {
    document.getElementById('descEditBtn').onclick = () => {
      draftDesc = profile.description || '';
      editingDesc = true;
      render();
    };
  }
}

function persistSocialInputs() {
  document.querySelectorAll('[data-net-url]').forEach(input => {
    const id = input.getAttribute('data-net-url');
    if (!profile.socials[id]) return;
    let url = input.value.trim();
    if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
    profile.socials[id].url = url;
  });
  saveProfile(profile);
}

function saveName() {
  const clean = (draftName.trim() || 'Usuario').slice(0, NAME_LIMIT);
  if (containsBannedWord(clean)) {
    const err = document.getElementById('nameError');
    if (err) {
      err.textContent = 'Ese nombre contiene palabras no permitidas.';
      err.classList.add('visible');
    }
    return;
  }
  profile.name = clean;
  editingName = false;
  saveProfile(profile);
  render();
}
function cancelName() {
  draftName = profile.name;
  editingName = false;
  render();
}

async function saveUsername() {
  const input = document.getElementById('usernameInput');
  const raw = (input?.value ?? draftUsername).trim().toLowerCase();
  const err = document.getElementById('usernameError');

  if (!/^[a-z0-9_]{3,20}$/.test(raw)) {
    if (err) err.textContent = 'Usa entre 3 y 20 letras/números/guion bajo, sin espacios ni acentos.';
    return;
  }
  if (containsBannedWord(raw)) {
    if (err) err.textContent = 'Ese nombre de usuario contiene palabras no permitidas.';
    return;
  }

  const sb = window.ocAuth && window.ocAuth.supabase;
  const user = window.ocAuth && window.ocAuth.currentUser;
  if (!sb || !user) {
    if (err) err.textContent = 'No se pudo conectar con el servidor.';
    return;
  }

  const { error } = await sb.from('profiles').update({ username: raw }).eq('id', user.id);
  if (error) {
    if (err) err.textContent = error.message.includes('duplicate')
      ? 'Ese @usuario ya lo tiene alguien más.'
      : 'No se pudo guardar: ' + error.message;
    return;
  }

  profile.username = raw;
  editingUsername = false;
  render();
}
function cancelUsername() {
  draftUsername = profile.username || '';
  editingUsername = false;
  render();
}

// El menú (abrir/cerrar, indicador ﹀/︿) ya lo controla auth.js.
// Aquí solo reaccionamos al estado de sesión: si no hay usuario logueado,
// esta página no debe mostrarse. Aprovechamos el mismo evento para traer
// el @usuario y la reputación desde Supabase.
if (window.ocAuth) {
  if (!ocAuth.currentUser) window.location.href = 'index.html';
  else fetchRemoteProfile();
  ocAuth.onChange((user) => {
    if (!user) window.location.href = 'index.html';
    else fetchRemoteProfile();
  });
}

render();
</script>
</body>
  </html>
