<!-- ===== Modal: Iniciar sesión / Crear cuenta ===== -->

<div class="auth-overlay" id="authOverlay">

  <div class="auth-card">

    <button
      class="auth-close"
      id="authClose"
      aria-label="Cerrar"
      type="button"
    >
      ✕
    </button>

    <div class="auth-brand">

      <img
        src="assets/logo.png"
        alt="Overclock"
      >

      <span>OVERCLOCK</span>

    </div>

    <h2
      class="auth-heading"
      id="authHeading"
    >
      Iniciar sesión
    </h2>

    <p
      class="auth-subheading"
      id="authSubheading"
    >
      Entra para seguir tus recomendaciones
    </p>

    <!-- GitHub -->

    <button
      type="button"
      class="auth-oauth"
      id="githubLogin"
    >

      <svg
        viewBox="0 0 16 16"
        fill="currentColor"
        aria-hidden="true"
      >
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
      </svg>

      Continuar con GitHub

    </button>

    <div class="auth-divider">
      <span>o con tu correo</span>
    </div>

    <p
      class="auth-error"
      id="authError"
    ></p>

    <!-- Pestañas -->

    <div class="auth-tabs">

      <button
        class="auth-tab active"
        id="tabLogin"
        type="button"
      >
        Iniciar sesión
      </button>

      <button
        class="auth-tab"
        id="tabRegister"
        type="button"
      >
        Crear cuenta
      </button>

    </div>

    <!-- Login -->

    <form
      class="auth-form active"
      id="formLogin"
    >

      <div class="auth-field">

        <label for="loginEmail">
          Correo
        </label>

        <input
          type="email"
          id="loginEmail"
          autocomplete="email"
          required
        >

      </div>

      <div class="auth-field">

        <label for="loginPassword">
          Contraseña
        </label>

        <input
          type="password"
          id="loginPassword"
          autocomplete="current-password"
          required
        >

      </div>

      <button
        type="submit"
        class="auth-submit"
      >
        Iniciar sesión
      </button>

    </form>

    <!-- Registro -->

    <form
      class="auth-form"
      id="formRegister"
    >

      <div class="auth-field">

        <label for="registerEmail">
          Correo
        </label>

        <input
          type="email"
          id="registerEmail"
          autocomplete="email"
          required
        >

      </div>

      <div class="auth-field">

        <label for="registerPassword">
          Contraseña
        </label>

        <input
          type="password"
          id="registerPassword"
          autocomplete="new-password"
          required
        >

      </div>

      <div class="auth-field">

        <label for="registerConfirm">
          Confirmar contraseña
        </label>

        <input
          type="password"
          id="registerConfirm"
          autocomplete="new-password"
          required
        >

      </div>

      <button
        type="submit"
        class="auth-submit"
      >
        Crear cuenta
      </button>

    </form>

    <!-- Cambiar entre login y registro -->

    <p
      class="auth-switch"
      id="authSwitch"
    >
      ¿No tienes cuenta?
      <button
        id="switchToRegister"
        type="button"
      >
        Crear una
      </button>
    </p>

  </div>

</div>
